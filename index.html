function translatedText(value){if(state.lang==='en'||!value)return value;const exact=sourceToKey[value.trim()];if(exact)return value.replace(value.trim(),t(exact));const waitPrefix=value.match(/^If you wait\s+(\d+)\s+days, estimated additional value is\s*$/i);if(waitPrefix)return state.lang==='hi'?`अगर आप ${waitPrefix[1]} दिन रुकते हैं, अनुमानित अतिरिक्त मूल्य है `:`तुम्ही ${waitPrefix[1]} दिवस थांबल्यास, अंदाजित अतिरिक्त निव्वळ मूल्य आहे `;const expected=value.match(/Expected price in\s+(\d+)\s+days/i);if(expected)return state.lang==='hi'?`${expected[1]} दिन बाद अनुमानित भाव`:`${expected[1]} दिवसांनंतरचा अंदाजित भाव`;let out=value;for(const [source,key] of Object.entries(sourceToKey).sort((a,b)=>b[0].length-a[0].length)){if(source.length<3)continue;const escaped=source.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');out=out.replace(new RegExp(`(?<![A-Za-z])${escaped}(?![A-Za-z])`,'gi'),t(key))}out=out.replace(/Good morning,\s*([^.!]+)[.!]?/gi,(_,name)=>`${t('dashboard.goodMorning')}, ${name}.`);return out}

function topbar(){return `<header class="topbar"><div class="mobile-brand"><div class="brandmark">${icons.leaf}</div>KhetiMitra</div><div class="crumb">Workspace&nbsp; / &nbsp;<b>${pages[state.screen]||'Dashboard'}</b></div><div class="top-right"><span class="demo-pill"><i class="dot"></i> DEMO DATA</span><select class="select-lang" id="language" data-language aria-label="Language"><option value="en" ${state.lang==='en'?'selected':''}>English</option><option value="hi" ${state.lang==='hi'?'selected':''}>हिंदी</option><option value="mr" ${state.lang==='mr'?'selected':''}>मराठी</option></select><button class="bell" aria-label="Notifications">${icons.bell}</button></div></header>`}
function pagehead(title,sub,eyebrow='FARMER WORKSPACE'){return `<div class="pagehead"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${sub}</p></div></div>`}
function chartSVG(values,labels){let w=700,h=180,p=22,min=Math.min(...values)-100,max=Math.max(...values)+100;let pts=values.map((v,i)=>[p+i*(w-2*p)/(values.length-1),h-p-(v-min)/(max-min)*(h-2*p)]);let line=pts.map((pt,i)=>(i?'L':'M')+pt.join(' ')).join(' '),area=line+` L ${pts.at(-1)[0]} ${h-p} L ${p} ${h-p} Z`;return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="Illustrative market price trend"><defs><linearGradient id="shade" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#8acb8a" stop-opacity=".25"/><stop offset="1" stop-color="#8acb8a" stop-opacity="0"/></linearGradient></defs>${[.15,.43,.71,.98].map(a=>`<line class="gridline" x1="${p}" x2="${w-p}" y1="${h*a}" y2="${h*a}"/>`).join('')}<path class="area" d="${area}"/><path class="line" d="${line}"/>${pts.map((pt,i)=>`<circle cx="${pt[0]}" cy="${pt[1]}" r="3.8"/> <text x="${pt[0]}" y="${h-2}" text-anchor="middle">${labels[i]}</text>`).join('')}</svg>`}
function cropCard(c,selectable=false){return `<article class="crop-card card ${selectable&&state.crop===c.id?'selected':''}" ${selectable?`data-crop="${c.id}"`:''}><div class="crop-photo" style="background-image:url('${photo(c.img)}')"><span class="crop-tag">${selectable?'SELECT CROP':'TODAY · APMC'}</span></div><div class="crop-body"><div class="crop-line"><strong>${c.name}</strong>${selectable?`<span class="radio ${state.crop===c.id?'active':''}"></span>`:`<span class="change ${c.cls}">${c.change}</span>`}</div><div class="crop-line" style="margin-top:7px"><span class="price">${fmt(c.price)} <small class="unit">/ qtl</small></span>${!selectable?`<span class="change ${c.cls}">${c.change}</span>`:''}</div>${!selectable?`<div class="small-muted">Modal price · ${state.market}</div>`:''}</div></article>`}
function dashboard(){let c=current();return `${`<section class="welcome card"><div class="welcome-copy"><div class="eyebrow">THURSDAY, 01 OCTOBER 2026</div><h2>Good morning, ${state.user.name.split(' ')[0]}.</h2><p>Know your market. Plan your sale. Make every quintal count.</p><button class="btn" data-go="crop">Start crop analysis ${icons.arrow}</button></div><div class="welcome-photo"></div><div class="weather-badge">${icons.pin} &nbsp;<b>${state.user.location}</b> &nbsp;·&nbsp; 28° C</div></section>`}<div class="section-title"><h2>What are you selling?</h2><button class="btn outline small" data-go="crop">View all crops ${icons.arrow}</button></div><div class="crop-grid">${crops.slice(0,3).map(c=>`<div data-crop="${c.id}">${cropCard(c)}</div>`).join('')}</div><div class="section-title"><h2>Market summary <span style="font-weight:400;color:var(--muted)">· ${state.market}</span></h2><small>Today · Demo snapshot</small></div><div class="summary-grid">${[['Total arrival','1,200','qtl',icons.box],['Maximum price','₹2,200','per quintal',icons.trend],['Minimum price','₹1,800','per quintal',icons.chart],['Modal price','₹2,000','per quintal',icons.leaf]].map(([l,v,u,i])=>`<div class="summary-card card"><div class="summary-head">${l}<span class="summary-icon">${i}</span></div><strong>${v}</strong><small>${u}</small></div>`).join('')}</div><div class="market-chart card"><div class="chart-heading"><div><strong>Tomato · 7 day price movement</strong><br><small>Illustrative prices · Pune APMC</small></div><span class="change up">${icons.trend} &nbsp;+5.2%</span></div>${chartSVG([1830,1870,1900,1920,1940,1950,2000],['Thu','Fri','Sat','Sun','Mon','Tue','Wed'])}</div>`}
function cropPage(){return `${pagehead('Select crop','Choose the crop you want to analyze.','NEW ANALYSIS')}<div class="layout-3">${crops.map(c=>cropCard(c,true)).join('')}</div><div class="actions"><button class="btn outline" data-go="dashboard">Back</button><button class="btn" data-go="market">Continue ${icons.arrow}</button></div>`}
function marketPage(){return `${pagehead('Select market','Choose the APMC market whose prices you want to review.','NEW ANALYSIS')}<div class="layout-2"><div class="card selection-list"><input class="search" id="marketSearch" placeholder="Search market or district…" value="${state.search}" aria-label="Search market">${markets.map(([n,loc])=>`<button class="choice ${state.market===n?'active':''}" data-market="${n}"><i class="radio"></i><span><b>${n}</b><small>${loc}</small></span>${state.market===n?'<span class="check">✓</span>':''}</button>`).join('')}</div><div class="card" style="padding:25px;background:#f2f7ef"><div class="eyebrow">YOUR SELECTION</div><h2 style="font:800 20px Manrope;margin:5px 0 6px">${state.market}</h2><p style="color:var(--muted);font-size:12px">${markets.find(x=>x[0]===state.market)?.[1]}</p><div style="margin-top:27px;padding:15px;background:#fff;border-radius:12px;font-size:11px;line-height:1.6;color:#637066"><b style="color:var(--forest)">Market snapshot</b><br>Modal price: ${fmt(current().price)} / quintal<br>Arrival: 1,200 quintals<br><small>Sample demo figures for this prototype.</small></div></div></div><div class="actions"><button class="btn outline" data-go="crop">Back</button><button class="btn" data-go="details">Continue ${icons.arrow}</button></div>`}
function detailsPage(){return `${pagehead('Tell us about your crop','A few details help us estimate the cost of holding your produce.','NEW ANALYSIS')}<div class="card form-card"><div class="form-grid"><div class="field"><label for="cropInput">Crop</label><select id="cropInput">${crops.filter(x=>x.id!=='other').map(c=>`<option value="${c.id}" ${state.crop===c.id?'selected':''}>${c.name}</option>`).join('')}</select></div><div class="field"><label for="marketInput">Market</label><select id="marketInput">${markets.map(([n])=>`<option value="${n}" ${state.market===n?'selected':''}>${n}</option>`).join('')}</select></div><div class="field"><label for="quantity">Quantity available</label><div class="field-row"><input type="number" min="1" max="100000" id="quantity" value="${state.quantity}"><span>Quintals</span></div><div class="hint">Enter the quantity you may sell or store.</div></div><div class="field"><label for="days">Expected storage duration</label><div class="field-row"><input type="number" min="0" max="90" id="days" value="${state.days}"><span>Days</span></div><div class="hint">Typical estimate: 15 days.</div></div><div class="field full"><label for="sellWhen">When do you want to sell?</label><select id="sellWhen"><option>Today</option><option>Within 7 days</option><option selected>After storage period</option><option>Choose a date</option></select></div></div><div class="err" id="formError"></div><div class="actions"><button class="btn outline" data-go="market">Back</button><button class="btn" id="runAnalysis">Get analysis ${icons.arrow}</button></div></div>`}
function pricePage(){let a=calc(),vals=[a.c.price-170,a.c.price-130,a.c.price-90,a.c.price-55,a.c.price-35,a.c.price-50,a.c.price];return `${pagehead('Current market price',`${state.market} · ${a.c.name} · demo snapshot`,'MARKET PULSE')}<div class="layout-2"><div class="card price-overview"><div class="market-label">${state.market} <span style="margin:0 7px;color:#cbd3cb">/</span> ${a.c.name}</div><h2>${fmt(a.c.price)} <small class="unit">/ quintal</small></h2><div class="trend change ${a.c.cls}">${a.c.change} from yesterday</div><div class="range"><span>Today's indicative range</span><b>${fmt(a.c.range[0])} – ${fmt(a.c.range[1])}</b></div><div class="notice">Demo market snapshot for product preview. Confirm current rates with your local APMC before making a sale.</div></div><div class="card market-chart" style="margin:0"><div class="chart-heading"><strong>7 day price trend</strong><small>₹ / quintal</small></div>${chartSVG(vals,['Mon','Tue','Wed','Thu','Fri','Sat','Sun'])}</div></div><div class="actions"><button class="btn outline" data-go="details">Back</button><button class="btn" data-go="forecast">View price forecast ${icons.arrow}</button></div>`}
function forecastPage(){let a=calc(),periods=['7 Days','15 Days','30 Days'];return `${pagehead('Price forecast','Estimated future prices based on sample trend assumptions.','OUTLOOK')}<div class="layout-2"><div class="card forecast-list"><div class="chart-heading"><strong>Expected price range</strong><small>${a.c.name} · ₹ / qtl</small></div>${periods.map((x,i)=>`<div class="forecast-row"><div><small>${x}</small><b>${fmt(a.c.forecast[i]-45)} – ${fmt(a.c.forecast[i]+70)}</b></div><span class="${a.c.forecast[i]>=a.c.price?'up':'down'}">${a.c.forecast[i]>=a.c.price?'↑':'↓'} ${Math.abs((a.c.forecast[i]-a.c.price)/a.c.price*100).toFixed(1)}%</span></div>`).join('')}<div class="notice">Forecast figures are estimates for demonstration only. They are not live market prices or a guarantee of future rates.</div></div><div class="card market-chart" style="margin:0"><div class="chart-heading"><strong>Illustrative price outlook</strong><small>₹ / qtl · estimate</small></div>${chartSVG([a.c.price,...a.c.forecast],['Today','7d','15d','30d'])}</div></div><div class="section-title"><h2>Forecast factors</h2><small>Signals considered in this demo</small></div><div class="factor-grid">${[['Historical prices',icons.chart,'Trend'],['Market arrival',icons.box,'Supply'],['Temperature',icons.trend,'Weather'],['Rainfall',icons.leaf,'Weather'],['Seasonality',icons.clock,'Crop cycle']].map(x=>`<div class="factor">${x[1]}<b>${x[0]}</b><small>${x[2]}</small></div>`).join('')}</div><div class="actions"><button class="btn outline" data-go="price">Back</button><button class="btn" data-go="storage">Review storage costs ${icons.arrow}</button></div>`}
function storagePage(){let a=calc();return `${pagehead('Storage & cost analysis','Estimate the cost of waiting for a better price.','COST OF HOLDING')}<div class="layout-2"><div class="card costlist"><div class="chart-heading"><strong>Your storage plan</strong><span class="demo-pill">${a.d} DAYS</span></div><div style="margin:18px 0 6px;font:800 28px Manrope">${a.q} <small class="unit">quintals</small></div><div class="small-muted">${a.c.name} · ${state.market}</div><div style="margin-top:16px">${[['Storage cost',fmt(a.storage)],['Expected physical loss',fmt(a.loss)],['Transportation cost',fmt(a.transport)]].map(([l,v])=>`<div class="costrow"><span>${l} <small>/ qtl</small></span><strong>${v}</strong></div>`).join('')}<div class="costrow"><span>Market risk</span><strong class="risk">Medium</strong></div><div class="costrow"><span>Crop perishability</span><strong class="high">High</strong></div><div class="costrow"><span>Estimated holding cost · total</span><strong>${fmt(a.totalCost)}</strong></div></div></div><div class="card market-chart" style="margin:0"><div class="eyebrow">NET ESTIMATE · PER QUINTAL</div><h2 style="font:800 23px Manrope;margin:8px 0 18px">${fmt(a.netNow)} <span style="color:#a5afa5;font-weight:400">→</span> ${fmt(a.netWait)}</h2><div style="display:flex;justify-content:space-between;font-size:10px;color:var(--muted)"><span>Sell now</span><span>Wait ${a.d} days, after costs</span></div>${chartSVG([a.c.price,a.netWait],['Sell now','Wait'])}<div class="notice">Holding cost uses demo assumptions of ₹6.67 storage + ₹5.33 expected loss per quintal per day, plus ₹30 transport.</div></div></div><div class="actions"><button class="btn outline" data-go="forecast">Back</button><button class="btn" data-go="decision">Calculate decision ${icons.arrow}</button></div>`}
function decisionPage(){let a=calc();return `${pagehead('Recommended decision','A balanced option using the details and demo estimates you entered.','DECISION SUPPORT')}<div class="decision-wrap"><div class="decision-card card"><div class="eyebrow">OUR DEMO RECOMMENDATION</div><h2>${a.decision}</h2><div class="donut-layout"><div class="donut" style="background:conic-gradient(#9dd37c 0 ${a.sellPct}%,#fff ${a.sellPct}% 100%)"><div class="donut-label">${a.sellPct}<small>% sell now</small></div></div><div class="legend"><div><i></i>${a.sellPct}% Sell now</div><div><i class="white"></i>${a.holdPct}% Hold for future</div></div></div><p style="font-size:10px;color:#d5e5d2;line-height:1.55;margin:20px 0 0">This split is a sample decision aid based on estimated prices, holding costs and crop risk.</p></div><div class="card decision-metrics">${[['Current price',`${fmt(a.c.price)} / qtl`,''],[`Expected price in ${a.d} days`,`${fmt(a.future)} / qtl`,''],['Expected price change',(a.future-a.c.price>=0?'+':'')+fmt(a.future-a.c.price)+' / qtl','good'],['Estimated holding cost & loss','−'+fmt(a.cost)+' / qtl',''],['Expected additional net value',(a.gain>=0?'+':'−')+fmt(Math.abs(a.gain))+' / qtl',a.gain>=0?'good':''],['Market risk','Medium','risk']].map(([l,v,cl])=>`<div class="metric-row"><span>${l}</span><strong class="${cl}">${v}</strong></div>`).join('')}<div class="notice">Decision support only. This is not financial advice. Forecast values are demo estimates, not guaranteed market outcomes.</div></div></div><div class="actions"><button class="btn outline" data-go="storage">Back</button><button class="btn" data-go="analysis">See detailed analysis ${icons.arrow}</button></div>`}
function analysisPage(){let a=calc();return `${pagehead('Detailed analysis','Compare the indicative outcomes and understand the trade-offs.','DECISION BREAKDOWN')}<div class="layout-2"><div class="card analysis-card"><div class="chart-heading"><strong>Profit comparison <span class="unit">(per quintal)</span></strong><small>Estimated net value</small></div><div class="bars"><div class="bar-col"><div class="bar" style="height:${Math.max(45,135*a.netNow/Math.max(a.netNow,a.netWait))}px"><b>${fmt(a.netNow)}</b></div><small>Sell now</small></div><div class="bar-col"><div class="bar pale" style="height:${Math.max(45,135*a.netWait/Math.max(a.netNow,a.netWait))}px"><b>${fmt(a.netWait)}</b></div><small>Wait ${a.d} days</small></div></div><p class="small-muted" style="margin-top:32px">Waiting estimate accounts for the entered holding duration and demo storage, loss and transport costs.</p></div><div class="card analysis-card"><div class="chart-heading"><strong>Why ${a.decision.toLowerCase()}?</strong><span class="demo-pill">ESTIMATE</span></div><div class="why-list">${['Expected prices may change during the holding period.','Market prices can move in either direction as arrivals shift.','Storage and physical loss reduce the value you may receive.','Perishability creates additional risk for this crop.','Splitting sales can balance immediate income and future opportunity.'].map(x=>`<div class="why-item"><span>✓</span>${x}</div>`).join('')}</div><div class="notice">If you wait ${a.d} days, estimated additional value is <b>${a.gain>=0?'+':''}${fmt(a.gain)} per quintal</b> after demo costs. Actual prices and costs may differ.</div></div></div><div class="actions"><button class="btn outline" data-go="decision">Back</button><button class="btn" id="saveAnalysis">Save to history ${icons.arrow}</button></div>`}
function historyPage(){return `${pagehead('Your analysis history','Revisit your previous crop decisions.','MY ACTIVITY')}<div class="tabs"><button class="${state.tab==='History'?'active':''}" data-tab="History">History</button><button class="${state.tab==='Profile'?'active':''}" data-tab="Profile">Profile</button></div>${state.tab==='History'?`<div class="history-list">${state.history.map((h,i)=>{let c=crops.find(x=>x.id===h.crop)||crops[0];return `<article class="history-item card" data-history="${i}"><div class="history-img" style="background-image:url('${photo(c.img,180)}')"></div><div><h3>${c.name}</h3><p>${h.market} · ${h.days} days</p></div><div class="history-meta"><strong>${h.decision}</strong><small>${localizedHistoryDate(h.date)}</small></div></article>`}).join('')||'<div class="empty">No saved analysis yet. Start a crop analysis to add one.</div>'}</div>`:`<div class="card profile-card">${profileInner()}</div>`}`}
function profileInner(){return `<div class="profile-head"><img alt="Farmer profile" src="${photo('photo-1500648767791-00dcc994a43e',200)}"><div><h2>${state.user.name}</h2><p>Farmer account · ${state.user.location}</p></div></div><div class="profile-data">${[['Mobile number',state.user.phone],['Location',state.user.location],['Preferred market',state.market],['Farm size',state.user.farm],['Main crops',state.user.crops],['Language',languageName(state.lang)]].map(([l,v])=>`<div><small>${l}</small><b>${v}</b></div>`).join('')}</div><div class="profile-actions"><button class="btn outline" data-action="edit-profile">Edit profile</button><button class="btn outline" data-action="password">Change password</button><button class="btn soft" data-action="logout">Log out</button></div>`}
function profilePage(){return `${pagehead('Farmer profile','Manage your account and preferences.','YOUR ACCOUNT')}<div class="card profile-card">${profileInner()}</div>`}
function loginPage(){return `${pagehead('Welcome back','Sign in to continue to your farming dashboard.','KHETIMITRA ACCOUNT')}<div class="card login-panel"><div class="login-photo"><h2>Smarter decisions for every harvest.</h2></div><div class="login-form"><h2>Welcome Back!</h2><p>Understand market prices, forecast trends and decide when to sell your crop.</p><div class="field"><label>Mobile number</label><input id="phone" type="tel" placeholder="10-digit mobile number" value=""></div><div class="field"><label>Password</label><input id="password" type="password" placeholder="Enter password"></div><div class="login-links"><a href="#" data-action="forgot">Forgot password?</a><span>Demo: enter any valid mobile & password</span></div><div class="err" id="loginError"></div><button class="btn" id="loginBtn">Login ${icons.arrow}</button><p style="margin:16px 0 0;text-align:center">New to KhetiMitra? <a href="#" data-action="signup" style="color:var(--forest);font-weight:700">Create account</a></p></div></div>`}
function splash(){return `<div class="splash"><select class="splash-language" data-language aria-label="Language"><option value="en" ${state.lang==='en'?'selected':''}>English</option><option value="hi" ${state.lang==='hi'?'selected':''}>हिंदी</option><option value="mr" ${state.lang==='mr'?'selected':''}>मराठी</option></select><div class="splash-bg"></div><div class="splash-content"><div><div class="splash-logo"><div class="brandmark">${icons.leaf}</div><span>KhetiMitra</span></div><h1>Know your market.<br><em>Choose your moment.</em></h1><p>Helping farmers decide when and how much to sell with market prices, estimated trends and the real cost of storage.</p><div class="splash-points"><span>Market insights</span><span>Price estimates</span><span>Simple decisions</span></div><button class="btn" data-action="start">Get started ${icons.arrow}</button></div><div class="splash-side"><b>Every harvest deserves a thoughtful decision.</b><p>A practical crop selling companion made for Indian farmers and local APMC markets.</p></div></div></div>`}
function stepper(){let seq=['crop','market','details','price','forecast','storage','decision','analysis'],idx=seq.indexOf(state.screen);return `<div class="stepper">${seq.map((s,i)=>`${i?'<i class="connector"></i>':''}<div class="step ${i===idx?'active':i<idx?'done':''}"><span>${i<idx?'✓':i+1}</span><b>${['Crop','Market','Details','Price','Forecast','Costs','Decision','Analysis'][i]}</b></div>`).join('')}</div>`}
function render(){document.title=translatedText('KhetiMitra — Smart Farming Decisions');let body={dashboard, crop:cropPage,market:marketPage,details:detailsPage,price:pricePage,forecast:forecastPage,storage:storagePage,decision:decisionPage,analysis:analysisPage,history:historyPage,profile:profilePage,login:loginPage}[state.screen]||dashboard;$('#app').innerHTML=`${sidebar()}<main class="main">${topbar()}<div class="content">${['crop','market','details','price','forecast','storage','decision','analysis'].includes(state.screen)?stepper():''}${body()}</div></main><nav class="mobile-nav">${navButtons().map(([id,ic,n])=>`<button data-go="${id}" class="${state.screen===id?'active':''}">${ic}${n}</button>`).join('')}</nav>${state.showSplash?splash():''}`;applyTranslations();bind()}
function toast(msg){let t=document.createElement('div');t.className='toast';t.textContent=translatedText(msg);document.body.append(t);setTimeout(()=>t.remove(),2600)}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));document.querySelectorAll('[data-crop]').forEach(b=>b.onclick=()=>{state.crop=b.dataset.crop;if(state.screen==='dashboard'){go('crop')}else render()});document.querySelectorAll('[data-market]').forEach(b=>b.onclick=()=>{state.market=b.dataset.market;render()});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=e=>{e.preventDefault();let a=b.dataset.action;if(a==='start'){state.showSplash=false;state.screen='login';render()}else if(a==='forgot')toast('Password reset is not connected in this demo. Contact your local KhetiMitra support.');else if(a==='signup')toast('Account registration will be available soon.');else if(a==='logout'){state.screen='login';render()}else if(a==='edit-profile')modal('Edit farmer profile',`<div class="field"><label>Farmer name</label><input id="editName" value="${state.user.name}"></div><div class="field" style="margin-top:12px"><label>Location</label><input id="editLocation" value="${state.user.location}"></div><div class="actions"><button class="btn outline" data-close>Cancel</button><button class="btn" id="saveProfile">Save</button></div>`);else if(a==='password')modal('Change password',`<div class="field"><label>Current password</label><input type="password"></div><div class="field" style="margin-top:12px"><label>New password</label><input type="password"></div><div class="actions"><button class="btn" data-close>Done</button></div>`) });document.querySelectorAll('[data-language]').forEach(el=>el.addEventListener('change',e=>{state.lang=e.target.value;state.user.language=languageName(state.lang);try{localStorage.setItem('khetimitra.language',state.lang)}catch{}render();toast('Language preference saved.')}));$('#marketSearch')?.addEventListener('input',e=>{state.search=e.target.value.toLowerCase();document.querySelectorAll('[data-market]').forEach(b=>b.classList.toggle('hidden',!b.dataset.market.toLowerCase().includes(state.search)||!markets.find(x=>x[0]===b.dataset.market)[1].toLowerCase().includes(state.search)&&!b.dataset.market.toLowerCase().includes(state.search))) });$('#runAnalysis')?.addEventListener('click',()=>{let q=+$('#quantity').value,d=+$('#days').value;if(!q||q<1||q>100000||d<0||d>90){$('#formError').textContent=translatedText('Enter a quantity from 1 to 100,000 quintals and storage from 0 to 90 days.');return}state.crop=$('#cropInput').value;state.market=$('#marketInput').value;state.quantity=q;state.days=d;state.sellWhen=$('#sellWhen').value;go('price')});$('#saveAnalysis')?.addEventListener('click',()=>{let a=calc();state.history.unshift({crop:state.crop,market:state.market,days:state.days,decision:a.decision,date:new Date().toLocaleDateString(state.lang==='hi'?'hi-IN':state.lang==='mr'?'mr-IN':'en-IN',{day:'numeric',month:'short',year:'numeric'})});toast('Analysis saved to your history.');go('history')});$('#loginBtn')?.addEventListener('click',()=>{let p=$('#phone').value.trim(),pw=$('#password').value;if(!/^[6-9]\d{9}$/.test(p)||pw.length<4){$('#loginError').textContent=translatedText('Enter a valid 10-digit Indian mobile number and a password of at least 4 characters.');return}state.logged=true;state.screen='dashboard';render()});document.querySelectorAll('[data-history]').forEach(b=>b.onclick=()=>{let h=state.history[+b.dataset.history];state.crop=h.crop;state.market=h.market;state.days=h.days;go('analysis')});document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>document.querySelector('.shade-modal')?.remove());$('#saveProfile')?.addEventListener('click',()=>{state.user.name=$('#editName').value;state.user.location=$('#editLocation').value;document.querySelector('.shade-modal')?.remove();render()})}
function modal(title,inside){let box=document.createElement('div');box.className='shade-modal';box.innerHTML=`<div class="card modal"><h2>${title}</h2>${inside}</div>`;box.onclick=e=>{if(e.target===box)box.remove()};document.body.append(box);applyTranslations(box);bind()}
function go(s){if(s==='history')state.tab='History';state.screen=s;render();window.scrollTo({top:0,behavior:'smooth'})}
render();
</script></body></html>
